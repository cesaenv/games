<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tetris · Celia Sáenz Villalta</title>
  <meta name="description" content="El Tetris de siempre, para jugar a mano o dejar que se juegue solo." />
  <link rel="stylesheet" href="https://saenzvillaltacelia.com/theme.css" />
  <link rel="stylesheet" href="../shared/games.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="../shared/autoplay.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://saenzvillaltacelia.com/favicon.svg" type="image/svg+xml" />
  <script src="../shared/chrome.js"></script>
</head>
<body>
  <div class="page">
    <div class="game-area">
      <main class="main">
        <header class="header">
          <h1 class="title">Tetris</h1>
          <div class="scores">
            <div class="score-panel">
              <span class="score-label">Puntos</span>
              <span class="score-value" id="score">0</span>
            </div>
            <div class="score-panel">
              <span class="score-label">Líneas</span>
              <span class="score-value" id="lines">0</span>
            </div>
            <div class="score-panel">
              <span class="score-label">Nivel</span>
              <span class="score-value" id="level">1</span>
            </div>
          </div>
        </header>

        <canvas class="board" id="board" width="300" height="600" role="img" aria-label="Tablero del Tetris"></canvas>

        <div class="touch" id="touch">
          <button type="button" class="btn btn-ghost" data-action="left" aria-label="Izquierda">◀</button>
          <button type="button" class="btn btn-ghost" data-action="rotate" aria-label="Girar">↻</button>
          <button type="button" class="btn btn-ghost" data-action="right" aria-label="Derecha">▶</button>
          <button type="button" class="btn btn-ghost" data-action="down" aria-label="Bajar">▼</button>
          <button type="button" class="btn btn-ghost" data-action="drop" aria-label="Dejar caer">⤓</button>
        </div>

        <p class="status" id="status" aria-live="polite"></p>
      </main>

      <aside class="sidebar">
        <div class="next">
          <span class="score-label">Siguiente</span>
          <canvas id="next" width="120" height="120" aria-hidden="true"></canvas>
        </div>
        <button class="btn" id="new-game">Nueva partida</button>
        <div id="auto-panel"></div>
        <p class="help">Flechas para mover y bajar, flecha arriba o X para girar, Z para girar al revés, espacio para dejar caer y P para pausar.</p>
      </aside>
    </div>
  </div>

  <div class="modal-overlay" id="game-over-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
      <h2 class="modal-title" id="game-over-title">Fin de la partida</h2>
      <p class="modal-message" id="game-over-message"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="game-over-close">Cerrar</button>
        <button class="btn" id="game-over-new-game">Nueva partida</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
