<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2048</title>
  <meta name="description" content="2048 con jugadores automáticos (IA) para comparar estrategias." />
  <link rel="stylesheet" href="https://saenzvillaltacelia.com/theme.css" />
  <link rel="stylesheet" href="../shared/games.css" />
  <link rel="stylesheet" href="../shared/autoplay.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://saenzvillaltacelia.com/favicon.svg" type="image/svg+xml" />
  <script src="../shared/chrome.js"></script>
</head>
<body>
  <div class="page">
    <div class="game-area">
      <main class="main">
        <header class="header">
          <h1 class="title">2048</h1>
          <div class="score-panel">
            <span class="score-label">Score</span>
            <span class="score-value" id="score">0</span>
          </div>
        </header>

        <div class="board" id="board"></div>

        <p class="status" id="status"></p>
      </main>

      <aside class="sidebar">
        <button class="btn btn-primary btn-block" id="new-game">New Game</button>

        <div id="auto-panel"></div>
      </aside>
    </div>

    <div class="guide-layout">
      <section class="panel modes-guide-panel">
        <h2 class="panel-title">AI Modes</h2>
        <div class="modes-guide-list" id="modes-guide-list"></div>
      </section>
    </div>
  </div>

  <div class="modal-overlay" id="game-over-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
      <h2 class="modal-title" id="game-over-title">Game Over</h2>
      <p class="modal-message" id="game-over-message"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="game-over-close">Close</button>
        <button class="btn btn-primary" id="game-over-new-game">New Game</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
